
name: Update GitHub Contribution Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate contribution graph
        run: node scripts/update-contributions.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Commit and push graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-graph.svg

          if git diff --cached --quiet; then
            echo "Graph is already up to date."
          else
            git commit -m "Update contribution graph"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
