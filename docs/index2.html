
<!DOCTYPE html>
<html>
<head>
  <title>My Contribution Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #0d1117;
      color: white;
      font-family: Arial;
      padding: 30px;
    }
    .chart-container {
      background: #161b22;
      padding: 25px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h2>📈 My Contribution Activity</h2>

  <div class="chart-container">
    <canvas id="contributionChart"></canvas>
  </div>

  <script>
    const labels = [
      "Jan", "Feb", "Mar", "Apr",
      "May", "Jun", "Jul", "Aug",
      "Sep", "Oct", "Nov", "Dec"
    ];

    const contributions = [
      5, 12, 8, 20, 15, 30,
      18, 25, 12, 40, 35, 44
    ];

    new Chart(
      document.getElementById("contributionChart"),
      {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "Contributions",
            data: contributions,
            borderColor: "#58a6ff",
            backgroundColor: "#58a6ff22",
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          interaction: {
            intersect: false,
            mode: "index"
          },
          plugins: {
            tooltip: { enabled: true }
          },
          scales: {
            x: {
              ticks: { color: "#8b949e" },
              grid: { color: "#30363d" }
            },
            y: {
              ticks: { color: "#8b949e" },
              grid: { color: "#30363d" }
            }
          }
        }
      }
    );
  </script>
</body>
</html>
