
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priyansh | Contribution Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 35px 20px;
  background: #0d1117;
  color: #e6edf3;
  font-family: Inter, Arial, sans-serif;
}
.container { max-width: 1100px; margin: auto; }
header {
  display: flex; justify-content: space-between;
  align-items: center; flex-wrap: wrap; gap: 15px;
  margin-bottom: 28px;
}
h1 { font-size: 25px; margin: 0; }
.blue { color: #58a6ff; }
select {
  background: #161b22; color: #e6edf3;
  border: 1px solid #30363d; padding: 10px 15px;
  border-radius: 8px; cursor: pointer;
}
.stats {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 15px; margin-bottom: 22px;
}
.card {
  background: #161b22; border: 1px solid #30363d;
  padding: 20px; border-radius: 12px;
}
.card small { color: #8b949e; }
.card h2 { color: #58a6ff; margin: 10px 0 0; font-size: 27px; }
.chartbox {
  background: #0d1117; border: 1px solid #30363d;
  padding: 25px; border-radius: 12px; height: 390px;
}
.chart-title {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 25px;
}
.chart-title h2 { font-size: 18px; margin: 0; }
.status { color: #8b949e; font-size: 12px; }
.footer { color: #8b949e; text-align: center; margin-top: 25px; font-size: 12px; }
@media(max-width:600px) {
  .stats { grid-template-columns: 1fr; }
  .chartbox { height: 320px; padding: 14px; }
  h1 { font-size: 20px; }
}
</style>
</head>
<body>
<div class="container">

<header>
  <h1>📈 <span class="blue">Priyansh's</span> Contribution Dashboard</h1>
  <select id="year">
    <option value="last">Loading years...</option>
  </select>
</header>

<div class="stats">
  <div class="card">
    <small>TOTAL CONTRIBUTIONS</small>
    <h2 id="total">—</h2>
  </div>
  <div class="card">
    <small>WEEKLY AVERAGE</small>
    <h2 id="average">—</h2>
  </div>
  <div class="card">
    <small>PEAK DAY</small>
    <h2 id="peak">—</h2>
  </div>
</div>

<div class="chartbox">
  <div class="chart-title">
    <h2>Contribution Activity</h2>
    <span class="status" id="status">Loading activity...</span>
  </div>
  <canvas id="activityChart"></canvas>
</div>

<div class="footer">
  Data sourced from GitHub Contributions API ·
  <a href="https://github.com/priyanshjain08"
     style="color:#58a6ff">View GitHub Profile</a>
</div>
</div>

<script>
const username = "priyanshjain08";
const yearSelect = document.getElementById("year");
const statusText = document.getElementById("status");
let chart;

async function loadDashboard(year = "last") {
  statusText.textContent = "Fetching GitHub activity...";

  try {
    const response = await fetch(
      `https://github-contributions-api.jogruber.de/v4/${username}?y=${year}`
    );

    if (!response.ok) throw new Error("API unavailable");

    const result = await response.json();
    const days = result.contributions || [];

    if (!days.length) throw new Error("No contribution data found");

    const totals = days.map(day => Number(day.count) || 0);
    const total = totals.reduce((a,b) => a+b, 0);
    const peak = Math.max(...totals);

    document.getElementById("total").textContent =
      total.toLocaleString();

    document.getElementById("average").textContent =
      (total / (days.length / 7)).toFixed(1);

    document.getElementById("peak").textContent = peak;

    const labels = days.map(day => day.date);

    if (chart) chart.destroy();

    const ctx = document.getElementById("activityChart").getContext("2d");
    const gradient = ctx.createLinearGradient(0,0,0,320);
    gradient.addColorStop(0,"rgba(88,166,255,0.30)");
    gradient.addColorStop(1,"rgba(88,166,255,0.00)");

    chart = new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "Contributions",
          data: totals,
          borderColor: "#58a6ff",
          backgroundColor: gradient,
          fill: true,
          tension: 0.35,
          borderWidth: 2.5,
          pointRadius: 0,
          pointHoverRadius: 6,
          pointHoverBackgroundColor: "#ffffff",
          pointHoverBorderColor: "#58a6ff",
          pointHoverBorderWidth: 3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          intersect: false,
          mode: "index"
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: "#161b22",
            borderColor: "#30363d",
            borderWidth: 1,
            padding: 12,
            callbacks: {
              title: items => items[0].label,
              label: item => ` ${item.raw} contributions`
            }
          }
        },
        scales: {
          x: {
            ticks: {
              color: "#8b949e",
              maxTicksLimit: 12,
              maxRotation: 0
            },
            grid: { display: false }
          },
          y: {
            beginAtZero: true,
            ticks: { color: "#8b949e", precision: 0 },
            grid: { color: "#21262d" }
          }
        }
      }
    });

    statusText.textContent = "● Live contribution data";
  } catch (error) {
    statusText.textContent = "Unable to load contribution data";
    console.error(error);
  }
}

async function initialize() {
  await loadDashboard("last");

  try {
    const response = await fetch(
      `https://github-contributions-api.jogruber.de/v4/${username}?y=all`
    );
    const data = await response.json();
    const years = Object.keys(data.total || {})
      .filter(year => /^\d{4}$/.test(year))
      .sort((a,b) => Number(b)-Number(a));

    yearSelect.innerHTML = years.map(year =>
      `<option value="${year}">${year}</option>`
    ).join("");

    if (years.length) {
      const currentYear = String(new Date().getFullYear());
      const selected = years.includes(currentYear) ? currentYear : years[0];
      yearSelect.value = selected;
      await loadDashboard(selected);
    }
  } catch (error) {
    yearSelect.innerHTML = '<option value="last">Latest activity</option>';
  }
}

yearSelect.addEventListener("change", event => {
  loadDashboard(event.target.value);
});

initialize();
</script>
</body>
</html>
